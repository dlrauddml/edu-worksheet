<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>실시간 공동 작업 학습지 (PDF 고화질 및 배율 최적화)</title>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; background-color: #f4f5f7; margin: 0; padding: 15px; display: flex; flex-direction: column; align-items: center; overflow-x: hidden; }
        
        #controls { 
            width: 100%; max-width: 1200px; margin-bottom: 15px; background: white; padding: 12px 20px; 
            border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); display: flex; gap: 15px; 
            align-items: center; flex-wrap: wrap; z-index: 1000; box-sizing: border-box;
        }
        
        .control-group { display: flex; align-items: center; gap: 8px; font-size: 14px; flex-wrap: wrap; }
        .control-divider { width: 1px; height: 24px; background-color: #ddd; margin: 0 5px; }

        .save-btn, .reset-btn { background-color: #0984e3; color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 13px; white-space: nowrap; }
        .save-btn:hover { background-color: #74b9ff; }
        .reset-btn { background-color: #636e72; }
        .reset-btn:hover { background-color: #b2bec3; }
        
        .role-badge { padding: 4px 8px; border-radius: 4px; font-weight: bold; font-size: 13px; color: white; white-space: nowrap; }
        .role-teacher { background-color: #d63031; }
        .role-student { background-color: #00b894; }

        /* 🚀 줌 래퍼: 배율에 맞춰 물리적 크기를 동기화하여 스크롤 꼬임 방지 */
        #zoom-wrapper { 
            position: relative; margin: 0 auto; transition: width 0.1s, height 0.1s; 
        }
        
        #worksheet-container { 
            position: absolute; top: 0; left: 0;
            width: 1200px; min-height: 800px; 
            background-color: white; border: 2px solid #ccc; cursor: crosshair; 
            box-shadow: 0 4px 8px rgba(0,0,0,0.1); 
            transform-origin: top left; transition: transform 0.1s ease-out; 
            /* 모바일에서 배경을 터치해 스크롤 가능하도록 auto 설정 */
            touch-action: auto; 
            overflow: hidden; box-sizing: border-box;
        }
        
        #pdf-canvas { 
            position: absolute; top: 0; left: 0; z-index: 0; pointer-events: none; 
            transform-origin: top left; transition: transform 0.05s ease-out; 
        }
        .placeholder-text { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #aaa; font-size: 18px; pointer-events: none; z-index: 1; text-align: center; width: 80%; }
        
        #online-users-container { position: fixed; top: 20px; right: 20px; width: 180px; background: white; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.15); padding: 15px; z-index: 1000; border: 1px solid #ddd; }
        .online-header { font-weight: bold; margin-bottom: 10px; font-size: 14px; border-bottom: 1px solid #eee; padding-bottom: 8px; color: #333; }
        #online-users-list { max-height: 300px; overflow-y: auto; }
        .online-user { font-size: 13px; padding: 5px 0; display: flex; align-items: center; color: #555; }
        .online-indicator { width: 8px; height: 8px; background-color: #2ecc71; border-radius: 50%; margin-right: 8px; box-shadow: 0 0 4px #2ecc71; }

        .sticky-note { position: absolute; box-shadow: 2px 2px 5px rgba(0,0,0,0.2); border-radius: 4px; display: flex; flex-direction: column; z-index: 10; resize: both; overflow: hidden; min-width: 140px; min-height: 100px; box-sizing: border-box; }
        .sticky-note.is-dragging { z-index: 99; opacity: 0.9; box-shadow: 4px 4px 10px rgba(0,0,0,0.3); }
        .sticky-note.readonly { resize: none !important; }

        .sticky-note.yellow { background-color: #ffeaa7; border: 1px solid #f1c40f; }
        .sticky-note.yellow .drag-handle { background-color: #f1c40f; }
        .sticky-note.blue { background-color: #74b9ff; border: 1px solid #0984e3; }
        .sticky-note.blue .drag-handle { background-color: #0984e3; }
        .sticky-note.blue .author-name, .sticky-note.blue .close-btn { color: white; }
        .sticky-note.pink { background-color: #fd79a8; border: 1px solid #e84393; }
        .sticky-note.pink .drag-handle { background-color: #e84393; }
        .sticky-note.pink .author-name, .sticky-note.pink .close-btn { color: white; }
        .sticky-note.green { background-color: #55efc4; border: 1px solid #00b894; }
        .sticky-note.green .drag-handle { background-color: #00b894; }

        /* 포스트잇 손잡이는 스크롤 방지 */
        .drag-handle { padding: 5px 8px; cursor: move; display: flex; justify-content: space-between; align-items: center; user-select: none; touch-action: none; }
        .drag-handle.readonly { cursor: default; }
        
        .author-name { font-size: 12px; font-weight: bold; color: #333; }
        .header-controls { display: flex; align-items: center; gap: 8px; }
        .color-palette { display: flex; gap: 4px; }
        .color-btn { width: 12px; height: 12px; border-radius: 50%; cursor: pointer; border: 1px solid rgba(0,0,0,0.2); }
        .color-btn.yellow { background-color: #f1c40f; }
        .color-btn.blue { background-color: #0984e3; }
        .color-btn.pink { background-color: #e84393; }
        .color-btn.green { background-color: #00b894; }
        .close-btn { cursor: pointer; font-size: 12px; color: #555; font-weight: bold; padding: 2px; }
        
        .sticky-note textarea { flex: 1; width: 100%; background: transparent; border: none; resize: none; outline: none; font-size: 14px; padding: 8px; box-sizing: border-box; touch-action: none; }
        .sticky-note textarea:read-only { color: #555; cursor: default; }

        @media screen and (max-width: 768px) {
            #controls { flex-direction: column; align-items: flex-start; gap: 10px; padding: 10px; }
            .control-divider { display: none; } 
            #teacher-controls { flex-direction: column; align-items: flex-start; gap: 10px; width: 100%; }
            #online-users-container { top: auto; bottom: 20px; right: 10px; width: 130px; padding: 10px; opacity: 0.85; }
            .online-header { font-size: 12px; margin-bottom: 5px; }
            .online-user { font-size: 11px; }
        }
    </style>
</head>
<body>

    <div id="online-users-container">
        <div class="online-header">🟢 접속 중 (<span id="online-count">0</span>명)</div>
        <div id="online-users-list"></div>
    </div>

    <div id="controls">
        <div class="control-group" style="width: 100%; justify-content: space-between;">
            <span id="role-badge" class="role-badge"></span>
            
            <div class="control-group">
                <strong>🔍 화면:</strong>
                <input type="range" id="zoom-slider" min="10" max="150" value="100" style="width: 70px;">
                <span id="zoom-val" style="min-width: 38px;">100%</span>
            </div>
        </div>

        <div id="teacher-controls">
            <div class="control-group">
                <label for="pdf-upload"><strong>📄 배경 업로드: </strong></label>
                <input type="file" id="pdf-upload" accept="application/pdf">
            </div>
            
            <div class="control-group">
                <strong>📐 배경 조절:</strong>
                <label>배율 <input type="range" id="pdf-scale" min="50" max="200" value="100" style="width: 60px;"></label>
                <label>가로 <input type="range" id="pdf-x" min="-400" max="400" value="0" style="width: 50px;"></label>
                <label>세로 <input type="range" id="pdf-y" min="-400" max="400" value="0" style="width: 50px;"></label>
                <button type="button" class="reset-btn" id="pdf-reset-btn">초기화</button>
            </div>
            
            <button class="save-btn" onclick="copyStudentLink()">🧑‍🎓 학생용 초대 링크 복사</button>
        </div>
    </div>

    <!-- 여백 버그를 방지하는 동적 리사이징 래퍼 -->
    <div id="zoom-wrapper">
        <div id="worksheet-container">
            <canvas id="pdf-canvas"></canvas>
            <div class="placeholder-text" id="placeholder">학습지가 준비되지 않았습니다.</div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

        // 1. 방 권한 분리 설정
        const urlParams = new URLSearchParams(window.location.search);
        let roomId = urlParams.get('room');
        let role = urlParams.get('role');
        let isTeacher = false;

        if (!roomId) {
            roomId = Math.random().toString(36).substr(2, 9);
            window.history.replaceState(null, '', '?room=' + roomId + '&role=teacher');
            isTeacher = true;
        } else if (role === 'teacher') {
            isTeacher = true;
        }

        const roleBadge = document.getElementById('role-badge');
        const teacherControls = document.getElementById('teacher-controls');
        
        if (isTeacher) {
            roleBadge.innerText = "👨‍🏫 교사 모드";
            roleBadge.className = "role-badge role-teacher";
        } else {
            roleBadge.innerText = "🧑‍🎓 학생 모드";
            roleBadge.className = "role-badge role-student";
            teacherControls.style.display = "none";
        }

        function copyStudentLink() {
            const link = window.location.origin + window.location.pathname + '?room=' + roomId;
            navigator.clipboard.writeText(link).then(() => {
                alert("학생용 초대 링크가 복사되었습니다!\n학생들은 본인 메모만 작성할 수 있습니다.\n\n링크: " + link);
            });
        }

        const container = document.getElementById('worksheet-container');
        const zoomWrapper = document.getElementById('zoom-wrapper');
        const canvas = document.getElementById('pdf-canvas');
        const ctx = canvas.getContext('2d');
        const placeholder = document.getElementById('placeholder');
        if(isTeacher) placeholder.innerText = "상단에서 PDF 파일을 선택하여 배경으로 불러오세요.";

        // ==========================================
        // 🚀 2. 래퍼 크기 동기화 및 모바일 줌(Zoom) 설정
        // ==========================================
        let currentZoom = 1;
        const zoomSlider = document.getElementById('zoom-slider');
        const zoomVal = document.getElementById('zoom-val');

        function setZoom(zoomValue) {
            currentZoom = zoomValue;
            zoomSlider.value = Math.round(currentZoom * 100);
            zoomVal.innerText = zoomSlider.value + '%';
            
            // 컨테이너 크기는 유지하되 스케일만 조절
            container.style.transform = `scale(${currentZoom})`;
            
            // 🚀 스케일에 맞춰 래퍼의 실제 물리적 크기 변경 (여백 버그 완벽 해결)
            zoomWrapper.style.width = (1200 * currentZoom) + 'px';
            zoomWrapper.style.height = (container.offsetHeight * currentZoom) + 'px';
        }

        function autoFitScreen() {
            const screenWidth = window.innerWidth;
            if (screenWidth < 1250) {
                let fitZoom = (screenWidth - 30) / 1200;
                if (fitZoom < 0.2) fitZoom = 0.2; 
                setZoom(fitZoom);
            } else {
                setZoom(1); // PC 기본 100%
            }
        }
        
        window.addEventListener('load', autoFitScreen);
        zoomSlider.addEventListener('input', (e) => setZoom(e.target.value / 100));

        // Firebase 설정 
        const firebaseConfig = {
            apiKey: "AIzaSyDtGTiFym_6Ijd7lCxFFZkPe0Q8uBb1BoE",
            authDomain: "history-a0be7.firebaseapp.com",
            projectId: "history-a0be7",
            storageBucket: "history-a0be7.firebasestorage.app",
            messagingSenderId: "856471000610",
            appId: "1:856471000610:web:a50c04ff92d0816e169c7b",
            databaseURL: "https://history-a0be7-default-rtdb.firebaseio.com"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const roomRef = db.ref('worksheets/' + roomId);
        const notesRef = roomRef.child('notes');
        const presenceRef = roomRef.child('presence');
        const bgRef = roomRef.child('pdf_background');
        const pdfTransformRef = roomRef.child('pdf_transform'); 

        // ==========================================
        // 🚀 3. PDF 고화질 렌더링 (High-DPI Retina 지원)
        // ==========================================
        bgRef.on('value', (snap) => {
            if (snap.val()) {
                renderPdfFromBase64(snap.val());
            } else {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                placeholder.style.display = 'block';
            }
        });

        if (isTeacher) {
            document.getElementById('pdf-upload').addEventListener('change', function(e) {
                const file = e.target.files[0];
                if (file && file.type === 'application/pdf') {
                    const reader = new FileReader();
                    reader.onload = function(ev) { bgRef.set(ev.target.result); };
                    reader.readAsDataURL(file);
                }
            });
        }

        function renderPdfFromBase64(dataUrl) {
            const base64 = dataUrl.split(',')[1];
            const binary = atob(base64);
            const len = binary.length;
            const buffer = new ArrayBuffer(len);
            const view = new Uint8Array(buffer);
            for (let i = 0; i < len; i++) view[i] = binary.charCodeAt(i);
            
            pdfjsLib.getDocument({ data: view }).promise.then(pdf => {
                pdf.getPage(1).then(page => {
                    const baseWidth = 1200; // 기준폭 1200 고정
                    const unscaledViewport = page.getViewport({ scale: 1.0 });
                    const pdfScale = baseWidth / unscaledViewport.width;
                    const viewport = page.getViewport({ scale: pdfScale });

                    // 모바일 기기의 화소 밀도(DPR)를 곱해 캔버스 물리 픽셀 크기를 대폭 증가 (흐려짐 완벽 방지)
                    const outputScale = window.devicePixelRatio || 1;
                    canvas.width = Math.floor(viewport.width * outputScale);
                    canvas.height = Math.floor(viewport.height * outputScale);
                    
                    // 화면에 보여지는 CSS 사이즈는 원래 사이즈로 강제 고정
                    canvas.style.width = Math.floor(viewport.width) + "px";
                    canvas.style.height = Math.floor(viewport.height) + "px";
                    
                    container.style.height = Math.floor(viewport.height) + 'px';
                    setZoom(currentZoom); // 높이가 변했으므로 래퍼 사이즈 재계산

                    const transform = outputScale !== 1 ? [outputScale, 0, 0, outputScale, 0, 0] : null;
                    page.render({ canvasContext: ctx, transform: transform, viewport: viewport });
                    
                    placeholder.style.display = 'none';
                });
            });
        }

        // 4. PDF 배경 크기/위치 조절 기능
        const pdfScaleInput = document.getElementById('pdf-scale');
        const pdfXInput = document.getElementById('pdf-x');
        const pdfYInput = document.getElementById('pdf-y');
        const pdfResetBtn = document.getElementById('pdf-reset-btn');

        pdfTransformRef.on('value', (snap) => {
            const val = snap.val() || { scale: 100, x: 0, y: 0 };
            const s = val.scale / 100;
            // 캔버스 자체의 transform 속성으로 위치 조절 적용
            canvas.style.transform = `translate(${val.x}px, ${val.y}px) scale(${s})`;
            
            if (isTeacher) {
                pdfScaleInput.value = val.scale;
                pdfXInput.value = val.x;
                pdfYInput.value = val.y;
            }
        });

        if (isTeacher) {
            const updateTransform = () => {
                pdfTransformRef.set({ scale: parseInt(pdfScaleInput.value, 10), x: parseInt(pdfXInput.value, 10), y: parseInt(pdfYInput.value, 10) });
            };
            pdfScaleInput.addEventListener('input', updateTransform);
            pdfXInput.addEventListener('input', updateTransform);
            pdfYInput.addEventListener('input', updateTransform);
            pdfResetBtn.addEventListener('click', () => pdfTransformRef.set({ scale: 100, x: 0, y: 0 }));
        }

        // 5. 접속자 현황
        let userName = prompt("활동에 참여할 이름을 입력하세요:\n(입력한 이름이 메모 작성자로 표시됩니다)", "");
        if (!userName || userName.trim() === "") userName = "익명";

        db.ref('.info/connected').on('value', (snap) => {
            if (snap.val() === true) {
                const myPresenceRef = presenceRef.push();
                myPresenceRef.onDisconnect().remove().then(() => myPresenceRef.set({ name: userName }));
            }
        });

        const onlineUsersList = document.getElementById('online-users-list');
        const onlineCount = document.getElementById('online-count');
        presenceRef.on('value', (snap) => {
            onlineUsersList.innerHTML = '';
            let count = 0;
            snap.forEach((childSnap) => {
                onlineUsersList.innerHTML += `<div class="online-user"><div class="online-indicator"></div><span>${childSnap.val().name}</span></div>`;
                count++;
            });
            onlineCount.innerText = count;
        });

        // 6. 포스트잇 생성 및 조작 (오작동 픽스 적용)
        container.addEventListener('click', function(e) {
            // 빈 공간(컨테이너, 캔버스, 플레이스홀더)을 정확히 탭했을 때만 포스트잇 생성
            if (e.target !== container && e.target !== canvas && e.target !== placeholder) return;
            const containerRect = container.getBoundingClientRect();
            const clickX = Math.round((e.clientX - containerRect.left) / currentZoom);
            const clickY = Math.round((e.clientY - containerRect.top) / currentZoom);
            notesRef.push().set({ left: clickX, top: clickY, width: 160, height: 120, text: "", author: userName, color: "yellow" });
        });

        notesRef.on('child_added', (snapshot) => renderStickyNote(snapshot.key, snapshot.val()));
        
        notesRef.on('child_changed', (snapshot) => {
            const data = snapshot.val();
            const id = snapshot.key;
            const note = document.getElementById('note-' + id);
            const textarea = document.getElementById('textarea-' + id);
            
            if (note) {
                note.className = 'sticky-note ' + (data.color || 'yellow');
                const isMine = (data.author === userName);
                if (!isTeacher && !isMine) note.classList.add('readonly');

                if (note.dataset.locked !== "true") {
                    note.style.left = data.left + 'px';
                    note.style.top = data.top + 'px';
                    note.style.width = data.width + 'px';
                    note.style.height = data.height + 'px';
                    note.dataset.w = data.width;
                    note.dataset.h = data.height;
                }
            }
            if (textarea && textarea !== document.activeElement) textarea.value = data.text;
        });

        notesRef.on('child_removed', (snapshot) => {
            const note = document.getElementById('note-' + snapshot.key);
            if (note) note.remove();
        });

        function renderStickyNote(id, data) {
            const note = document.createElement('div');
            note.id = 'note-' + id;
            note.style.left = data.left + 'px'; 
            note.style.top = data.top + 'px';
            note.style.width = data.width + 'px';
            note.style.height = data.height + 'px';
            note.dataset.w = data.width;
            note.dataset.h = data.height;

            const dragHandle = document.createElement('div');
            dragHandle.className = 'drag-handle';

            const authorDiv = document.createElement('span');
            authorDiv.className = 'author-name';
            authorDiv.innerText = data.author || '익명';

            const headerControls = document.createElement('div');
            headerControls.className = 'header-controls';

            const palette = document.createElement('div');
            palette.className = 'color-palette';
            ['yellow', 'blue', 'pink', 'green'].forEach(c => {
                const btn = document.createElement('div');
                btn.className = 'color-btn ' + c;
                btn.onmousedown = (e) => e.stopPropagation(); 
                btn.ontouchstart = (e) => e.stopPropagation(); 
                btn.onclick = (e) => { e.stopPropagation(); notesRef.child(id).update({ color: c }); };
                palette.appendChild(btn);
            });

            const closeBtn = document.createElement('span');
            closeBtn.className = 'close-btn';
            closeBtn.innerHTML = '✖';
            closeBtn.onmousedown = (e) => e.stopPropagation();
            closeBtn.ontouchstart = (e) => e.stopPropagation();
            closeBtn.onclick = () => notesRef.child(id).remove(); 

            headerControls.appendChild(palette);
            headerControls.appendChild(closeBtn);
            dragHandle.appendChild(authorDiv);
            dragHandle.appendChild(headerControls);

            const textarea = document.createElement('textarea');
            textarea.id = 'textarea-' + id;
            textarea.value = data.text;
            textarea.placeholder = "의견을 입력하세요...";
            textarea.addEventListener('input', (e) => notesRef.child(id).update({ text: e.target.value }));
            textarea.addEventListener('mousedown', (e) => e.stopPropagation());
            textarea.addEventListener('touchstart', (e) => e.stopPropagation());

            note.appendChild(dragHandle);
            note.appendChild(textarea);
            container.appendChild(note);

            const isMine = (data.author === userName);
            const hasPermission = isTeacher || isMine;

            note.className = 'sticky-note ' + (data.color || 'yellow');
            
            if (!hasPermission) {
                headerControls.style.display = 'none'; 
                textarea.readOnly = true;              
                dragHandle.classList.add('readonly');  
                note.classList.add('readonly');        
            }

            dragHandle.addEventListener('mousedown', startDrag);
            dragHandle.addEventListener('touchstart', startDrag, { passive: false });

            function startDrag(e) {
                if (!hasPermission) return; 
                if (e.cancelable) e.preventDefault();
                e.stopPropagation();
                
                const isTouch = e.type === 'touchstart';
                const startEvt = isTouch ? (e.touches[0] || e.changedTouches[0]) : e;
                if (!startEvt) return;

                note.dataset.locked = "true";
                note.classList.add('is-dragging');

                const startX = startEvt.clientX;
                const startY = startEvt.clientY;
                const initialLeft = parseInt(note.style.left, 10) || 0;
                const initialTop = parseInt(note.style.top, 10) || 0;

                function onMove(moveEvent) {
                    const mEvt = isTouch ? (moveEvent.touches[0] || moveEvent.changedTouches[0]) : moveEvent;
                    if (!mEvt) return;

                    const dx = (mEvt.clientX - startX) / currentZoom;
                    const dy = (mEvt.clientY - startY) / currentZoom;
                    
                    note.style.left = (initialLeft + dx) + 'px';
                    note.style.top = (initialTop + dy) + 'px';
                }

                function onEnd() {
                    if (isTouch) {
                        document.removeEventListener('touchmove', onMove);
                        document.removeEventListener('touchend', onEnd);
                    } else {
                        document.removeEventListener('mousemove', onMove);
                        document.removeEventListener('mouseup', onEnd);
                    }
                    
                    note.classList.remove('is-dragging');
                    notesRef.child(id).update({ left: parseInt(note.style.left), top: parseInt(note.style.top) });
                    setTimeout(() => { note.dataset.locked = "false"; }, 500);
                }

                if (isTouch) {
                    document.addEventListener('touchmove', onMove, { passive: false });
                    document.addEventListener('touchend', onEnd);
                } else {
                    document.addEventListener('mousemove', onMove);
                    document.addEventListener('mouseup', onEnd);
                }
            }

            function checkResize() {
                if (!hasPermission) return;
                const currentW = note.offsetWidth;
                const currentH = note.offsetHeight;
                if (note.dataset.w != currentW || note.dataset.h != currentH) {
                    note.dataset.w = currentW; note.dataset.h = currentH;
                    notesRef.child(id).update({ width: currentW, height: currentH });
                }
            }
            note.addEventListener('mouseup', checkResize);
            note.addEventListener('touchend', checkResize);
        }
    </script>
</body>
</html>
